<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politiskās mākslas laboratorija · 9. klase</title>
<style>
:root{
  --deep:#6B2FA0;
  --bright:#9D5CE6;
  --light:#C9A7F5;
  --bg:#F3ECFC;
  --accent:#FFD166;
  --ink:#2A1B3D;
  --muted:#6E5A85;
  --line:#E2D3F6;
  --white:#FFFFFF;
  --display:"Candara","Gill Sans MT","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Aptos","Segoe UI","Candara",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#app{
  position:absolute;top:0;left:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:18px;
  line-height:1.55;
  -webkit-text-size-adjust:100%;
}
.wrap{width:1600px;height:900px;padding:26px 30px;display:grid;grid-template-columns:400px 1fr;gap:30px}
.side{display:flex;flex-direction:column;gap:18px;min-height:0}
.side .steps{flex-direction:column;margin:0;flex-wrap:nowrap}
.side .chip{flex:0 0 auto;padding:12px 14px;font-size:.88em}
.side .foot{margin-top:auto}
#labApp{min-height:0;overflow:auto;position:relative}
#labApp .panel{margin-top:0}
#labApp .grid{grid-template-columns:repeat(3,1fr);gap:16px}
#labApp .card{padding:22px 20px;font-size:1.05em}
#labApp .card .ico{flex-basis:44px;height:44px}
#labApp .card svg{width:26px;height:26px}
.res-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.res-grid .meters{grid-template-columns:1fr;margin-top:0}
.res-grid .talk,.res-grid .note{margin-top:14px}
#fsBtn{position:relative;z-index:2;align-self:flex-start;font-family:var(--body);font-size:15px;font-weight:600;background:var(--white);color:var(--deep);
  border:1.5px solid var(--light);border-radius:999px;padding:9px 18px;cursor:pointer}
#fsBtn:hover{background:var(--deep);color:#fff;border-color:var(--deep)}

/* ---------- Galvene ---------- */
.hero{
  background:linear-gradient(135deg,var(--deep) 0%,var(--bright) 62%,var(--light) 100%);
  border-radius:22px;
  padding:26px 26px 24px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-70px;
  width:230px;height:230px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.35);
}
.hero::before{
  content:"";position:absolute;right:10px;bottom:-110px;
  width:180px;height:180px;border-radius:50%;
  background:rgba(255,209,102,.25);
}
.eyebrow{
  font-size:.72em;letter-spacing:.16em;text-transform:uppercase;
  opacity:.9;margin:0 0 6px;font-weight:600;
}
h1{
  font-family:var(--display);
  font-size:2.1rem;
  line-height:1.12;margin:0 0 10px;font-weight:700;
  position:relative;z-index:1;
}
.hero p{margin:0;max-width:44ch;opacity:.95;position:relative;z-index:1}

/* ---------- Soļu josla ---------- */
.steps{
  display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap;
}
.chip{
  flex:1 1 150px;
  display:flex;align-items:center;gap:9px;
  background:var(--white);border:1.5px solid var(--line);
  border-radius:12px;padding:9px 12px;
  font-size:.82em;color:var(--muted);
  cursor:default;text-align:left;font-family:var(--body);
  transition:.18s;
}
.chip .num{
  width:22px;height:22px;flex:0 0 22px;border-radius:50%;
  background:var(--line);color:var(--deep);
  display:grid;place-items:center;font-size:.78em;font-weight:700;
}
.chip.done{border-color:var(--light);color:var(--deep);cursor:pointer}
.chip.done .num{background:var(--bright);color:#fff}
.chip.done:hover{background:#FBF7FF;transform:translateY(-1px)}
.chip.active{border-color:var(--deep);color:var(--deep);box-shadow:0 0 0 3px rgba(157,92,230,.16)}
.chip.active .num{background:var(--deep);color:#fff}
.chip b{display:block;font-weight:600;font-size:1.02em;line-height:1.2}
.chip span{display:block;font-size:.9em;opacity:.8}

/* ---------- Solis ---------- */
.panel{margin-top:22px;animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q{font-family:var(--display);font-size:1.9rem;margin:0 0 4px;color:var(--deep)}
.hint{margin:0 0 16px;color:var(--muted);font-size:.92em}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.card{
  background:var(--white);border:1.5px solid var(--line);border-radius:16px;
  padding:16px 15px;text-align:left;cursor:pointer;
  font-family:var(--body);font-size:1em;color:var(--ink);
  transition:.16s;display:flex;gap:12px;align-items:flex-start;
}
.card:hover{border-color:var(--bright);transform:translateY(-2px);box-shadow:0 8px 20px rgba(107,47,160,.13)}
.card:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--deep);background:#FBF7FF;box-shadow:0 0 0 3px rgba(157,92,230,.2)}
.card .ico{flex:0 0 34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--deep)}
.card svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card b{display:block;font-weight:600;margin-bottom:2px}
.card em{display:block;font-style:normal;font-size:.85em;color:var(--muted);line-height:1.4}

/* ---------- Rezultāts ---------- */
.label{
  background:var(--white);border-radius:18px;padding:26px 26px 22px;
  border-left:6px solid var(--accent);
  box-shadow:0 10px 30px rgba(107,47,160,.1);
}
.label .kind{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--bright);font-weight:700;margin:0 0 8px}
.label h2{font-family:var(--display);font-size:2.1rem;margin:0 0 2px;color:var(--deep);line-height:1.14}
.label .meta{font-size:.86em;color:var(--muted);margin:0 0 16px}
.label .rule{height:1px;background:var(--line);margin:16px 0}
.label .desc{margin:0 0 12px}
.label .kicker{margin:0;font-family:var(--display);font-size:1.05em;color:var(--deep)}

.meters{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}
.meter{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.meter .name{font-size:.74em;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.meter .val{font-family:var(--display);font-weight:700;color:var(--deep);font-size:1.12em}
.bars{display:flex;gap:5px;margin-bottom:9px}
.bars i{height:8px;flex:1;border-radius:99px;background:var(--line);transition:.4s}
.bars i.on{background:var(--bright)}
.bars i.on:nth-child(3){background:var(--deep)}
.meter p{margin:0;font-size:.87em;color:var(--muted);line-height:1.45}

.talk{margin-top:16px;background:linear-gradient(135deg,#F8F2FF,#FBF7FF);border:1.5px dashed var(--light);border-radius:16px;padding:18px 18px 14px}
.talk h3{font-family:var(--display);margin:0 0 10px;color:var(--deep);font-size:1.12em}
.talk ul{margin:0;padding-left:20px}
.talk li{margin-bottom:7px}
.talk li::marker{color:var(--bright)}

.note{
  margin-top:16px;background:var(--deep);color:#fff;border-radius:16px;
  padding:18px 20px;font-family:var(--display);font-size:1.08em;line-height:1.4;
}
.note span{display:block;font-family:var(--body);font-size:.8em;opacity:.85;margin-top:6px;line-height:1.5}

/* ---------- Pogas ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{
  font-family:var(--body);font-size:.95em;font-weight:600;
  border-radius:12px;padding:11px 20px;cursor:pointer;border:1.5px solid transparent;transition:.16s;
}
.btn:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.btn-main{background:var(--deep);color:#fff}
.btn-main:hover{background:var(--bright)}
.btn-ghost{background:var(--white);color:var(--deep);border-color:var(--light)}
.btn-ghost:hover{background:#FBF7FF;border-color:var(--bright)}
.btn-back{background:transparent;color:var(--muted);border-color:var(--line)}
.btn-back:hover{color:var(--deep);border-color:var(--light)}

.foot{margin-top:26px;text-align:center;font-size:.8em;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
<div class="wrap">
 <div class="side">
  <header class="hero">
    <p class="eyebrow">9. klase · 5. tēma · Identitāte un laikmets mākslā</p>
    <h1>Politiskās mākslas laboratorija</h1>
    <p>Pieņem četrus lēmumus, kādus pieņem mākslinieks. Skaties, kas ar tavu ideju notiek pēc tam.</p>
  </header>

  <nav class="steps" id="steps" aria-label="Darba soļi"></nav>
  <button id="fsBtn" type="button">⛶ Atvērt pilnekrānu</button>

  <p class="foot">visaskola.lv · Rīks nesaglabā datus. Aizverot lapu, viss izzūd.</p>
 </div>

  <main id="labApp" aria-live="polite"></main>
</div>
</div>

<script>
"use strict";

/* ============ IKONAS ============ */
const I = {

/* ============ SATURA BANKA ============ */
/* Visi teksti ir iepriekš uzrakstīti. Rīks tos tikai saliek kopā — nekas netiek ģenerēts brīvi. */

const STEPS = [
  {

      {id:"privatums", ico:"eye", name:"Privātums un novērošana",

       sub:"Kam mēs ticam un kāpēc",
       frag:"viltus ziņām un tam, kam mēs ticam",
       sapr:0, strid:1,
       titles:["Ticams avots","Čuksti","Pārbaudīts","Nepatiesi"]},
      {id:"identitate", ico:"profile", name:"Digitālā identitāte",
       sub:"Tēls, ko cilvēks rada par sevi internetā",
       frag:"tēlam, ko cilvēks pats rada par sevi internetā",

    ]
  },
  {
    key:"medijs", chip:"Medijs", chipSub:"Kādā formā?",
    q:"Kādā formā tu to izsaki?",

    options:[
      {id:"instalacija", ico:"cube", name:"Instalācija",
       sub:"Telpisks darbs, kurā skatītājs var ieiet",
       frag:"telpiska instalācija, kurā skatītājs var ieiet",
       rez:2, sapr:2, strid:1},
      {id:"performance", ico:"body", name:"Performance",
       sub:"Darbība ar paša ķermeni, notiek vienu reizi",
       frag:"performance, kas notiek tikai vienu reizi",
       rez:3, sapr:1, strid:3},
      {id:"siena", ico:"wall", name:"Sienas gleznojums",
       sub:"Liels attēls publiskā vietā",
       frag:"sienas gleznojums publiskā vietā",
       rez:3, sapr:3, strid:2},
      {id:"video", ico:"play", name:"Video māksla",
       sub:"Kustīgs attēls ar skaņu un montāžu",

       rez:1, sapr:3, strid:0},

      {id:"internets", ico:"net", name:"Internetā",

const METERS = [
  { key:"rez", name:"Rezonanse",
    bands:[
      {v:"Klusa",     t:"Darbs uzrunās nedaudzus, bet, iespējams, dziļi. Ne katrai idejai vajag skaļumu."},

const Q_TONIS = {
  ironija:"Vai ironiju sapratīs arī tas, kam darbs adresēts, vai tikai tie, kas jau piekrīt?",
  poetika:"Ja darbs neko nepasaka tieši, kā zināt, vai vēstījums vispār nonāca līdz skatītājam?",

};
const Q_AUD = {
  skola:"Vai darbs skolā var būt patiess, ja autors zina, ka to redzēs viņa skolotāji?",
  pilseta:"Kam pieder siena? Vai mākslai publiskā vietā ir jāprasa atļauja?",

};

/* ============ STĀVOKLIS (tikai atmiņā) ============ */
let step = 0;
const pick = { tema:null, medijs:null, tonis:null, auditorija:null };

const app = document.getElementById("labApp");
const nav = document.getElementById("steps");

function svg(k){ return '<svg viewBox="0 0 24 24" aria-hidden="true">'+I[k]+'</svg>'; }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============ SOĻU JOSLA ============ */
function renderNav(){
  nav.innerHTML = STEPS.map((s,i)=>{
    const chosen = pick[s.key];
    const cls = "chip" + (i===step && step<STEPS.length ? " active" : "") + (chosen ? " done" : "");
    const sub = chosen ? chosen.name : s.chipSub;
    const tag = chosen ? "button" : "div";
    return `<${tag} class="${cls}" ${chosen?`data-goto="${i}" type="button"`:""}>
      <span class="num">${i+1}</span>
      <span><b>${s.chip}</b><span>${esc(sub)}</span></span>
    </${tag}>`;
  }).join("");
  nav.querySelectorAll("[data-goto]").forEach(b=>{
    b.onclick = ()=>{ step = +b.dataset.goto; render(); };
  });
}

/* ============ SOĻA SKATS ============ */
function renderStep(){
  const s = STEPS[step];
  const cur = pick[s.key];
  app.innerHTML = `<section class="panel">
    <h2 class="q">${esc(s.q)}</h2>
    <p class="hint">${esc(s.hint)}</p>
    <div class="grid" role="group" aria-label="${esc(s.q)}">
      ${s.options.map(o=>`
        <button class="card" type="button" data-id="${o.id}" aria-pressed="${cur&&cur.id===o.id?"true":"false"}">
          <span class="ico">${svg(o.ico)}</span>
          <span><b>${esc(o.name)}</b><em>${esc(o.sub)}</em></span>
        </button>`).join("")}
    </div>
    <div class="actions">
      ${step>0 ? '<button class="btn btn-back" type="button" id="back">← Atpakaļ</button>' : ''}
    </div>
  </section>`;

  app.querySelectorAll(".card").forEach(btn=>{
    btn.onclick = ()=>{
      pick[s.key] = s.options.find(o=>o.id===btn.dataset.id);
      app.querySelectorAll(".card").forEach(b=>b.setAttribute("aria-pressed", b===btn ? "true":"false"));
      setTimeout(()=>{ step = nextOpen(); render(); }, 220);
    };
  });
  const back = document.getElementById("back");
  if(back) back.onclick = ()=>{ step--; render(); };
}

/* Nākamais neatbildētais solis; ja visi atbildēti — rezultāts. */
function nextOpen(){
  for(let i=0;i<STEPS.length;i++) if(!pick[STEPS[i].key]) return i;
  return STEPS.length;
}

/* ============ APRĒĶINS ============ */
function score(key){
  let n = 0;
  STEPS.forEach(s=>{
    const o = pick[s.key];
    if(o && typeof o[key] === "number") n += o[key];
  });
  return n;
}
function band(m){
  const n = score(m.key);
  return n <= m.cuts[0] ? 0 : (n <= m.cuts[1] ? 1 : 2);
}

/* ============ REZULTĀTA SKATS ============ */
function renderResult(){
  const t = pick.tema, m = pick.medijs, o = pick.tonis, a = pick.auditorija;
  const title = t.titles[o.ti];

  const meters = METERS.map(mt=>{
    const b = band(mt), d = mt.bands[b];
    return `<div class="meter">
      <div class="top"><span class="name">${mt.name}</span><span class="val">${d.v}</span></div>
      <div class="bars">${[0,1,2].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</div>
      <p>${d.t}</p>
    </div>`;
  }).join("");

  const desc = `Darbs ir ${m.frag}, kas pievēršas ${t.frag}. ${o.frag} Tas ir domāts ${a.frag}.`;

  app.innerHTML = `<section class="panel">
   <div class="res-grid">
    <div>
    <article class="label">
      <p class="kind">Darba etiķete</p>
      <h2>„${esc(title)}”</h2>
      <p class="meta">${esc(m.name)} · ${esc(o.name)} · ${esc(a.name)} · 2026</p>
      <p class="desc">${esc(desc)}</p>
      <div class="rule"></div>
      <p class="kicker">Autors nav pateicis, kas ir pareizi. Autors ir uzdevis jautājumu.</p>
    </article>

    <div class="talk">
      <h3>Divi jautājumi grupas sarunai</h3>
      <ul>
        <li>${esc(Q_TONIS[o.id])}</li>
        <li>${esc(Q_AUD[a.id])}</li>
      </ul>
    </div>

    <div class="note">
      Tas nav vērtējums. Tas ir sarunas sākums.
      <span>Rādītāji nav mērījums — tie ir pieņēmumi, ko var apstrīdēt. Ja tev šķiet citādi, pamato kāpēc: tieši tā strādā mākslas kritika.</span>
    </div>
    </div>
    <div>
    <div class="meters">${meters}</div>

    <div class="actions">
      <button class="btn btn-main" type="button" id="copy">Kopēt etiķeti</button>
      <button class="btn btn-ghost" type="button" id="one">Mainīt vienu izvēli</button>
      <button class="btn btn-back" type="button" id="reset">Sākt no jauna</button>
    </div>
    <p class="hint" style="margin-top:12px">Pamēģini nomainīt tikai <b>toni</b> vai tikai <b>vietu</b> un salīdzini, cik ļoti mainās rezultāts.</p>
    </div>
   </div>
  </section>`;

  document.getElementById("reset").onclick = ()=>{
    STEPS.forEach(s=>pick[s.key]=null); step = 0; render();
  };
  document.getElementById("one").onclick = ()=>{ step = 2; render(); };
  document.getElementById("copy").onclick = (e)=>{
    const txt =
      `„${title}”\n${m.name} · ${o.name} · ${a.name}\n\n${desc}\n\n` +
      METERS.map(mt=>{const b=band(mt);return `${mt.name}: ${mt.bands[b].v} — ${mt.bands[b].t}`;}).join("\n") +
      `\n\nJautājumi sarunai:\n• ${Q_TONIS[o.id]}\n• ${Q_AUD[a.id]}\n\nTas nav vērtējums. Tas ir sarunas sākums.`;
    copy(txt, e.target);
  };
}

function copy(text, btn){
  const done = ()=>{ btn.textContent = "Nokopēts ✓"; setTimeout(()=>btn.textContent="Kopēt etiķeti", 1800); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly","");
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}
  document.body.removeChild(ta);
}

/* ============ ZĪMĒŠANA ============ */
function render(){
  renderNav();
  if(step >= STEPS.length) renderResult(); else renderStep();
  reportHeight();
}
function reportHeight(){
  return; /* 16:9 versijā iframe augstumu nosaka proporcija */
  try{
    if(window.parent !== window){
      window.parent.postMessage({type:"visaskola-height", height:document.documentElement.scrollHeight}, "*");
    }
  }catch(e){}
}
window.addEventListener("resize", reportHeight);
render();
</script>

<script>
/* ── 16:9 mērogošana un pilnekrāns ── */
(function(){
  const app = document.getElementById('app');
  window.APP_SCALE = 1;
  function fitApp(){
    const W = window.innerWidth, H = window.innerHeight;
    const sc = Math.min(W/1600, H/900); window.APP_SCALE = sc;
    app.style.transform = 'scale(' + sc + ')';
    app.style.left = Math.max(0,(W-1600*sc)/2) + 'px';
    app.style.top  = Math.max(0,(H-900*sc)/2) + 'px';
  }
  window.addEventListener('resize', fitApp); fitApp();
  const btn = document.getElementById('fsBtn');
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function fallback(){ if(confirm('Pilnekrāna režīms šajā logā nav pieejams. Atvērt rīku jaunā cilnē?')) window.open(location.href,'_blank'); }
  function toggle(){
    const el = document.documentElement;
    try{
      if(isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if(el.requestFullscreen) el.requestFullscreen().catch(fallback);
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else fallback();
    }catch(e){ fallback(); }
  }
  function upd(){ btn.textContent = isFs() ? '✕ Iziet no pilnekrāna' : '⛶ Atvērt pilnekrānu'; setTimeout(fitApp, 60); }
  btn.addEventListener('click', toggle);
  document.addEventListener('fullscreenchange', upd);
  document.addEventListener('webkitfullscreenchange', upd);
})();
</script>
</body>
</html>
